[package]
name = "yggdrasil"
version = "0.12.3"
edition = "2021"

# 构建时工具二进制：用 syntect（server-only 依赖）生成 highlight.css。
# 仅在启用 server feature 时编译——WASM 前端构建（--no-default-features --features web）
# 不会拉入 syntect，此二进制若也参与编译会因找不到 syntect 报错。
[[bin]]
name = "generate_highlight_css"
required-features = ["server"]

[dependencies]
dioxus = { version = "0.7.10", features = ["fullstack", "router"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"], optional = true }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"], optional = true }
deadpool-postgres = { version = "0.14", optional = true }
argon2 = { version = "0.5", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
regex = { version = "1.13", optional = true }
# mhchem 化学公式转译器（src/api/mhchem.rs）需要 lookahead 正则，
# Rust `regex` crate 不支持 `(?=...)`/`(?!...)`，故用 `fancy-regex`。
# 该 crate 已被 syntect 间接引入（0.16.2，见 Cargo.lock），此处显式声明为直接依赖。
fancy-regex = { version = "0.16", optional = true }
pulldown-cmark = { version = "0.13", optional = true }
dotenvy = { version = "0.15", optional = true }
tracing = { version = "0.1", optional = true, features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", optional = true }

rand = { version = "0.8", features = ["getrandom"], optional = true }
http = { version = "1", optional = true }
axum = { version = "0.8", optional = true, features = ["multipart"] }
tower-http = { version = "0.7", optional = true, features = ["compression-full", "timeout", "trace"] }

serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
lol_html = { version = "3", optional = true }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "default-fancy", "html", "parsing", "dump-load", "yaml-load"], optional = true }
# NOTE: WebP decoder is intentionally excluded from the image crate.
# We use zenwebp for both encoding and decoding to ensure consistency.
# Do NOT add "webp" to the features list without updating src/webp.rs.
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "gif"] }
zenwebp = { version = "0.4", optional = true }
moka = { version = "0.12", features = ["future", "sync"], optional = true }
governor = { version = "0.10", optional = true }
sysinfo = { version = "0.39", optional = true }
sqlparser = { version = "0.62", optional = true }
dashmap = { version = "6.2", optional = true }
# 中文标题 → 拼音 slug（纯 Rust、零依赖，安全交叉编译到 musl/FreeBSD）。
pinyin = { version = "0.11", optional = true }
md-5 = { version = "0.10", optional = true }
futures = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }
bollard = { version = "0.21", optional = true }
# 把 mpsc::Receiver 包成 Stream,供 axum SSE handler 使用。
# axum::response::sse::{Sse,KeepAlive,Event} 随 axum 0.8 自带,无需额外 dep。
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
# 全局分配器：用 mimalloc 替换系统 malloc。多线程高频小对象分配吞吐显著提升，
# 且对全静态 musl 链接友好（生产 Docker 镜像即 musl 目标）。
# server-only：经 server feature 启用；WASM 前端构建不编译（见 main.rs cfg 门控）。
mimalloc = { version = "0.1", optional = true }
# KaTeX 服务端数学公式渲染：纯 Rust 重实现（无 JS 运行时），渲染 $...$ / $$...$$
# 为 HTML span。库名是 katex（crate 名 katex-rs），代码用 `use katex::...`。
# 默认 features 为空即原生服务端编译；wasm feature 仅前端构建才需，这里不开。
# 配套前端需引入 katex.min.css + 字体（见 public/katex/、Makefile katex-css）。
katex-rs = { version = "0.2", optional = true }
# MCP（Model Context Protocol）服务器：官方 Rust SDK rmcp。
# 必须锁在 3.x beta 线（稳定版 0.2.1 缺 Origin 校验/协议版本头/体积上限/无状态默认等
# spec 强制项）。2026-07-28 经临时 axum-0.8 探针验证可挂载（见 docs/mcp-spec.md）。
# transport-worker 必须显式加：LocalSessionManager 无条件引用 transport::worker。
rmcp = { version = "=3.0.0-beta.3", optional = true, features = ["server", "macros", "transport-streamable-http-server", "transport-worker"] }
# MCP token 静态加密（AES-GCM）：管理员可在后台重查明文，DB 不裸存。
aes-gcm = { version = "0.10", optional = true }
# MCP 媒体上传：URL 抓取（服务端按图，带 SSRF 防护）。rustls-tls 不引入 OpenSSL，
# 对静态 musl 链接友好；stream 用于按大小上限流式读取，避免无界响应撑爆内存。
# 重定向在代码里禁用（避免被 302 到内网 IP，绕过 SSRF 白名单）。
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "stream"] }
# 备份的 uploads 素材打包（tar.gz）。纯 Rust 实现，不依赖运行时镜像里的
# busybox/GNU tar 行为；仅 server 构建使用（spawn_blocking 内跑）。
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Document", "Window", "Storage", "Element", "HtmlElement", "DomTokenList", "MediaQueryList", "HtmlImageElement", "MouseEvent", "KeyboardEvent", "Node", "NodeList", "DomRect", "EventTarget", "Navigator", "Clipboard", "File", "FileList", "FormData", "Request", "RequestInit", "Response", "Headers", "ClipboardEvent", "DataTransfer", "HtmlInputElement", "EventSource", "MessageEvent", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# 把 serde 类型（如 SqlSchema）序列化为 JsValue，供 wasm-bindgen extern 传递。
serde-wasm-bindgen = "0.6"

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }
serial_test = "3"

# dev 构建只保留行表 debuginfo：默认 full debuginfo 对每个 crate（含全部依赖）
# 都生成完整类型/局部变量信息，显著拖慢 rustc emit 与链接、撑大 target/。
# line-tables-only 砍掉这些（backtrace 行号保留），对生成代码零影响——
# 运行时性能不变，gdb/lldb 里看不到局部变量是唯一代价。dx serve 每次热重载
# 都要重链接 server 与 wasm 两个 dev 产物，此处收益是每次重编的固定开销。
[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = false
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# panic 直接终止：WASM 去掉 unwind 元数据以减小体积；server 端错误处理走
# Result + ?（见 src/api/error.rs），不依赖 panic unwind，进程级崩溃由
# systemd/k8s 拉起。这是 Dioxus 官方 optimizing 指南推荐的 WASM 瘦身项。
panic = "abort"

# WASM 前端专用 release profile（dx 的 web release 构建固定使用 `wasm-release`
# profile 名，见 dioxus-cli 0.7.10 platform.rs::profile_name）。显式声明后 dx 会
# 跳过它对未声明 profile 的临时注入（request.rs::profile_args 仅在 Cargo.toml
# 缺少该 profile 时才注入 opt-level="s"），从而拿回 rustc 侧优化级别的控制权：
# - opt-level="z"：比 dx 默认注入的 "s" 更激进的体积优化（禁用循环展开等）。
#   博客前端对极致运行时性能不敏感，体积优先。
# - 其余项（lto/codegen-units/panic=abort）继承 release。
# 注意：dx 始终强制该 profile strip=false（资产系统需要符号），最终 strip 由
# wasm-opt -Oz 完成，不影响产物体积。
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"

[features]
default = ["web", "server"]
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:tokio",
    "dep:tokio-postgres",
    "dep:deadpool-postgres",
    "dep:argon2",
    "dep:uuid",
    "dep:regex",
    "dep:fancy-regex",
    "dep:pulldown-cmark",
    "dep:rand",
    "dep:http",
    "dep:sha2",
    "dep:hex",
    "dep:dotenvy",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:lol_html",
    "dep:syntect",
    "dep:axum",
    "dep:tower-http",
    "dep:image",
    "dep:zenwebp",
    "dep:moka",
    "dep:governor",
    "dep:sysinfo",
    "dep:sqlparser",
    "dep:dashmap",
    "dep:pinyin",
    "dep:md-5",
    "dep:futures",
    "dep:bytes",
    "dep:bollard",
    "dep:tokio-stream",
    "dep:mimalloc",
    "dep:katex-rs",
    "dep:rmcp",
    "dep:reqwest",
    "dep:tar",
    "dep:flate2",
    "dep:aes-gcm",
]
