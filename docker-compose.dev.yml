# docker-compose.dev.yml — Docker 开发环境
#
# 用法：
#   make docker-dev          # 构建并启动（compose watch 前台, 热重载）
#   make docker-dev-down     # 停止并移除容器
#   make docker-dev-shell    # 进入 dev 容器交互式 shell
#
# 或直接：
#   docker compose -f docker-compose.dev.yml up --build -d
#   docker compose -f docker-compose.dev.yml watch
#
# 架构：
#   ┌─────────────────────────────────────────────────────┐
#   │ Host (macOS)                                        │
#   │   PostgreSQL = 全局 Docker 容器 global-postgres      │
#   │     (global-databases_default 网络, 不由本 compose 管理) │
#   │   IDE 编辑源码 ──compose watch sync──▶ /build        │
#   │  浏览器 ◀── :8080 ────────── dx serve (:8080)       │
#   └─────────────────────────────────────────────────────┘
#
# 文件同步（2026 最佳实践, 替代 bind mount）：
#   Dockerfile.dev 构建时 COPY 源码快照进镜像（容器启动即有完整源码）;
#   compose watch 把宿主变更增量 sync 进容器 —— 容器内 inotify 原生生效,
#   源码 stat 不再走 VirtioFS 桥, cargo/git 操作更快更可靠。
#   宿主 public/ 下的生成物（style.css/tiptap/ 等）不 sync —— 容器内 make dev 自行生成。
#   依赖清单（Cargo.lock/pnpm-lock 等）变化 → watch 自动 rebuild 镜像。
#
# 数据库：dev 容器加入 global-databases_default 外部网络, 直接按容器名
# 连接 global-postgres（issuser/trust）。不走 host.docker.internal ——
# Docker Desktop 会为该域名同时注入 AAAA(IPv6) 记录, 容器无 v6 路由时
# tokio-postgres 会拿到 ENETUNREACH(os error 101) 并直接失败。
#
# Volume 策略：
#   target/ → named volume        cargo 编译缓存（避免 VirtioFS 性能瓶颈）
#   libs/node_modules → volume    pnpm 依赖（与宿主隔离）
#   cargo registry → named volume crate 下载缓存
#   uploads/ → bind mount          宿主与容器双向共享素材(修复 serve_image 404)
#
# env_file: .env 注入宿主密钥（MCP_TOKEN_ENC_KEY 等，等价 bind mount 时代
# dotenvy 读 /build/.env 的行为）; environment 优先级更高，显式 DATABASE_URL
# 覆盖 .env 里指向 localhost 的值。

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        CN_MIRROR: "true"  # 本地开发在国内，启用镜像加速
    # PID 1 信号/僵尸处理（make dev 作为入口, 否则 Ctrl+C 会残留 dx serve 子进程）
    init: true
    networks:
      - default
      # 全局 PostgreSQL 所在网络（global-postgres 容器, 由用户的
      # global-databases compose 项目管理, external 引用）
      - global-databases
    volumes:
      # cargo 编译产物 — named volume 避免 VirtioFS 小文件性能瓶颈
      - yggdrasil-dev-target:/build/target
      # pnpm 依赖 — 与宿主 node_modules 隔离
      - yggdrasil-dev-node-modules:/build/libs/node_modules
      # pnpm 全局 store — named volume 避免重复下载
      - yggdrasil-dev-pnpm-store:/root/.local/share/pnpm/store
      # cargo registry + git 缓存 — named volume 避免 crate 重复下载
      - yggdrasil-dev-cargo-registry:/usr/local/cargo/registry
      - yggdrasil-dev-cargo-git:/usr/local/cargo/git
      # 防止 pnpm 在项目根目录创建 .pnpm-store/ 残留进容器层
      - /build/.pnpm-store
      # Code runner: 挂载 Docker socket（代码沙箱默认启用, 需先构建 runner 镜像
      # bash docker/build-runners.sh）。docker.sock 是宿主 root 级边界, 仅限本地开发。
      - /var/run/docker.sock:/var/run/docker.sock
      # uploads 共享宿主目录:DB 引用的素材文件存在于宿主 ./uploads,容器需能读到
      # 才能正确 serve;容器内新上传也落盘到宿主,跨 rebuild 持久化。与生产
      # docker run -v "$PWD/uploads:/app/uploads" 模式一致。uploads 为低频大文件,
      # bind mount 的 VirtioFS 开销可忽略(不像 target/ 的海量小文件)。
      - ./uploads:/build/uploads
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # 连接全局 Docker PostgreSQL（issuser/trust, 无需密码）。
      # 优先级高于 env_file（.env 里是宿主直跑的 localhost 直连串）。
      DATABASE_URL: postgres://issuser@global-postgres:5432/yggdrasil
      RUST_LOG: info
      SSR_CACHE_SECS: "0"
      APP_BASE_URL: http://localhost:8080
      # Code runner（socket 已挂载）
      DOCKER_SOCKET_PATH: /var/run/docker.sock
    # compose watch：源码增量 sync 进容器（dx serve inotify 热重载原生生效），
    # 依赖/构建文件变化自动 rebuild 镜像。ignore 排除生成物与缓存。
    develop:
      watch:
        - path: ./src
          target: /build/src
          action: sync
        - path: ./libs
          target: /build/libs
          action: sync
          ignore:
            - node_modules/
            - "*/node_modules/"
        - path: ./migrations
          target: /build/migrations
          action: sync
        - path: ./themes
          target: /build/themes
          action: sync
        - path: ./Makefile
          target: /build/Makefile
          action: sync
        - path: ./Dioxus.toml
          target: /build/Dioxus.toml
          action: sync
        # .cargo/config.toml: SERVER_FN_OVERRIDE_KEY + wasm cfg workaround,
        # 容器内 dx 编译必需
        - path: ./.cargo
          target: /build/.cargo
          action: sync
        # 依赖清单变化 → 重建镜像（COPY 新源码快照 + 重跑 make dev）
        - path: ./public
          target: /build/public
          action: rebuild
          ignore:
            - style.css
            - highlight.css
            - katex/
            - tiptap/
            - codemirror/
            - lightbox/
            - yggdrasil-core/
            - xterm/
            - doc/
        - path: ./input.css
          target: /build/input.css
          action: rebuild
        - path: ./Cargo.toml
          action: rebuild
        - path: ./Cargo.lock
          action: rebuild
        - path: ./libs/package.json
          action: rebuild
        - path: ./libs/pnpm-lock.yaml
          action: rebuild
        - path: ./Dockerfile.dev
          action: rebuild

networks:
  global-databases:
    external: true
    name: global-databases_default

volumes:
  yggdrasil-dev-target:
  yggdrasil-dev-node-modules:
  yggdrasil-dev-cargo-registry:
  yggdrasil-dev-cargo-git:
  yggdrasil-dev-pnpm-store:
