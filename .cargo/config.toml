# 服务端（及所有主机目标构建）以 erase_components 编译：组件返回值擦除为 AnyView。
# 浏览器 WASM 由 cargo-leptos 的 `always-erase-components` 打开同一开关（见 Cargo.toml
# [package.metadata.leptos]）。两端必须一致：擦除与否会改变 SSR 输出的水合结构，
# 只擦一端时页面停在未水合状态且没有任何报错。
# 注意：设置了 RUSTFLAGS 环境变量的构建会忽略这里（Dockerfile / Dockerfile.cross 的服务端构建已显式带上）。
[build]
rustflags = ["--cfg", "erase_components"]

# wasm32 目标的 getrandom 后端：浏览器环境必须使用 wasm_js 后端，
# 且只能为 wasm32 目标设置，不能泄漏到服务端构建。
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

# Uncomment and adjust after installing a musl C toolchain:
[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"
