# Dioxus 0.7.10 的 #[server(Fn, "/api")] 宏在 URL 末尾追加一个去冲突数字后缀:
#   xxh64( <key> + ":" + module_path!(), 0 )
# 默认 <key> = CARGO_MANIFEST_DIR（编译时 crate 绝对路径）。不同构建环境路径不同会算出不同后缀。
#
# 本项目三条构建路径各自的 CARGO_MANIFEST_DIR:
#   - make dev / make build    ：server 与 wasm 同在宿主仓库目录编译，路径一致。
#   - Dockerfile.cross         ：两个 builder stage 均以 WORKDIR /build 编译
#                                （Stage A glibc Trixie 编 wasm，Stage B Alpine-zig 交叉编 server），
#                                同容器内路径一致；全程无 QEMU、无宿主 cross 工具链（cross 已废弃）。
# 各路径内部自洽，但相互之间 CARGO_MANIFEST_DIR 不同 → 后缀会漂移。
#
# 宏内置逃生舱：编译时若设置了 SERVER_FN_OVERRIDE_KEY，则用它替代 CARGO_MANIFEST_DIR 作为
# hash key（见 dioxus-fullstack-macro src/lib.rs:392）。[env] 让 cargo 把该变量注入 rustc，
# server 与 wasm 两次编译读到同一个值，后缀在所有环境下恒定一致。即便各路径内部已自洽，
# 保留该 key 仍是确定性兜底：后缀与环境解耦，日志里 /api/<fn><后缀> 与浏览器请求在任意机器一致。
[env]
SERVER_FN_OVERRIDE_KEY = "yggdrasil"
# Workaround for Dioxus 0.7.10 leaking the wasm_js getrandom backend cfg
# into the server build. We disable DX's automatic flag in the Makefile
# and set it only for the wasm32 target here.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

# Uncomment and adjust after installing a musl C toolchain:
[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"
