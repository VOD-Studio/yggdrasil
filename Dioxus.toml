[application]
name = "yggdrasil"
default_platform = "web"
out_dir = "dist"

# 构建期为所有静态资产（wasm/js/css…）生成 .br 预压缩旁车文件。
# dioxus-server 的静态路由用 ServeFile::precompressed_br() 注册（server.rs），
# 客户端 Accept-Encoding: br 时直接回 .br：3.4M 的 wasm 线上传输降到 ~1.0M，
# 且零运行时压缩 CPU。Dockerfile 的 `cp -r public/*` 会带上旁车文件。
[web]
pre_compress = true

[web.app]
title = "Yggdrasil - Dioxus SSR"

# 显式钉住 wasm-opt 级别：-Oz 激进体积优化（0.7.10 枚举默认即 Z，钉住防回归）。
[web.wasm_opt]
level = "z"

[web.watcher]
watch_path = ["src", "Cargo.toml"]

[web.resource]
# v=2 用于绕开旧的一年 immutable 缓存；后续更新由 no-cache 条件请求校验。
# dev 会继承此列表，勿在 web.resource.dev 再次声明。
# 编辑器与终端由组件挂载时按需加载（yggdrasil-core/browser-library.ts）。
style = ["/style.css?v=2", "/highlight.css?v=2", "/katex/katex.min.css?v=2", "/lightbox/lightbox.css?v=2", "/yggdrasil-core/yggdrasil-core.css?v=2"]
script = ["/lightbox/lightbox.js?v=2", "/yggdrasil-core/yggdrasil-core.js?v=2"]

# Dioxus 0.7 要求 dev 字段存在；空列表表示没有额外的开发资源。
[web.resource.dev]
style = []
script = []
