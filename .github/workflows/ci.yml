name: CI

# 流水线（2026 runner fallback + 原生多 runner 构建，零 QEMU）：
# - 受信任的默认分支 push、tag 和手动触发：x64 检查/amd64 构建优先尝试组织 self-hosted；
#   runner 不可用、API 无权限或 runner group 未允许公开仓库时自动回退 ubuntu-latest。
# - pull_request 和非默认分支 push 始终使用 GitHub-hosted runner：本仓库公开，避免不受信任代码污染持久 runner。
# - release/publish/deploy 保持 GitHub-hosted：这些 job 使用写权限或部署密钥，不把 secrets 带到持久 runner。
# - arm64 构建保持 ubuntu-24.04-arm（组织 runner-1 是 X64，不能替代）。
# - 每次 push（任意分支/tag）和 PR：跑 test（单测+lint）→ build-amd64
# - 仅 push 新 tag（v*）或手动触发时：
#     build-arm64（原生 ubuntu-24.04-arm runner）
#     release（amd64 镜像 + arm64 镜像 + x86_64 musl 二进制 发布到 GitHub Release）
#     deploy（xun 从 GHCR 拉取 app + runner 镜像，compose up 滚动重启）
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# 同 ref 后一次推送取消前一次（tag 与分支互不影响，各自的 group）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── runner selection：仅在 hosted runner 上查询，避免 self-hosted 离线时 job 排队 ──
  # ORG_RUNNER_TOKEN 可作为 repo/org secret 提供；需要读取组织 runner/group 的权限。
  # 缺少 token、API 失败、runner 忙/离线或公开仓库未获 runner group 授权时均安全回退。
  select_runner:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
      - name: Choose x64 runner
        id: choose
        env:
          GH_TOKEN: ${{ secrets.ORG_RUNNER_TOKEN || github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          runner='["ubuntu-latest"]'
          reason="default GitHub-hosted runner"
          trusted_ref=false

          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" || "$GITHUB_REF" == refs/tags/* ) ]]; then
            trusted_ref=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            trusted_ref=true
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            reason="public pull request"
          elif [[ "$trusted_ref" == true ]]; then
            # visible_to_repository 对 public repo 返回空(GitHub API 已知行为)，改查全部 group 再按 allows_public_repositories 过滤
            if group_ids="$(gh api --paginate "orgs/${GITHUB_REPOSITORY_OWNER}/actions/runner-groups?per_page=100" --jq '.runner_groups[] | select(.visibility == "all" and .allows_public_repositories == true) | .id' 2>/dev/null)"; then
              available=false
              while IFS= read -r group_id; do
                [[ -z "$group_id" ]] && continue
                if group_runner="$(gh api --paginate "orgs/${GITHUB_REPOSITORY_OWNER}/actions/runner-groups/${group_id}/runners?per_page=100" --jq '
                  .runners[] |
                  select(.status == "online" and .busy == false and
                    ([.labels[].name | ascii_downcase] | index("self-hosted") != null) and
                    ([.labels[].name | ascii_downcase] | index("linux") != null) and
                    ([.labels[].name | ascii_downcase] | index("x64") != null)) |
                  "available"
                ' 2>/dev/null)"; then
                  if [[ -n "$group_runner" ]]; then
                    available=true
                    break
                  fi
                fi
              done <<< "$group_ids"

              if [[ "$available" == true ]]; then
                runner='["self-hosted","Linux","X64"]'
                reason="online and idle organization self-hosted runner"
              else
                reason="no online and idle matching self-hosted runner"
              fi
            else
              echo "::warning::无法读取组织 runner/group 状态；请配置 ORG_RUNNER_TOKEN，回退 GitHub-hosted runner"
              reason="runner status API unavailable"
            fi
          else
            reason="untrusted branch push"
          fi

          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "::notice::x64 runner selected: $runner ($reason)"

  # ── 检查阶段：拆成 3 个并行 job（按工具链与产物共享切分）──
  # 原 test job 串行跑 fmt/clippy/wasm/biome/test。cargo 对 target/ 持排他锁，同 job 内
  # 并行无效；真正并行只能拆 job（多 runner）。按「能否真正并行 / 是否共享产物」切分：
  #   test       — fmt + clippy + cargo test（Rust，三者共享 target/debug 编译：
  #                clippy --all-targets 已编译全部 test targets，cargo test 复用其产物）
  #   lint-js    — Biome（仅 Node，不装 Rust；test job 也不再装 Node）
  #   check-wasm — wasm32 check（独立 feature 集 web-only + 独立 triple，与 server 产物不相交）
  # 两个 cargo job 用独立 cache key 后缀（-rust- / -wasm-），避免并行写同一 GHA cache key
  # 失败策略：非 tag 推送时，所有 lint/check（fmt/clippy/Biome/wasm）允许失败
  # （continue-on-error，仍执行并显示结果，但不阻断下游 build）；只有 cargo test
  # 始终阻断。tag 推送（v*）时全部严格，任一失败即阻断 build/release/deploy。
  test:
    needs: select_runner
    runs-on: ${{ fromJSON(needs.select_runner.outputs.runner) }}
    steps:
      # dtolnay/rust-toolchain：走 GitHub CDN，比 curl|sh 快 ~10-15s，含 clippy+rustfmt 组件。
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Swatinem/rust-cache：cache key 自动含 rustc 版本 + Cargo.lock hash，
      # 防止 toolchain 升级后命中过期缓存（旧手动方案会命中 → 全量重编）。
      # prefix 区分 test（host target）与 check-wasm（wasm32 target），避免缓存互踩。
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust

      # 非 tag 时允许失败（仅显示结果，不阻断 build）；tag 时严格。
      - name: Check formatting
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: cargo fmt -- --check

      - name: Clippy (all targets, all features)
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # clippy --all-targets 已编译全部 test targets，cargo test 复用其产物，串行最省编译。
      - name: Run tests
        run: cargo test --locked --all-features

  lint-js:
    needs: select_runner
    runs-on: ${{ fromJSON(needs.select_runner.outputs.runner) }}
    # 非 tag 时整个 lint job 允许失败（不阻断下游 build）；tag 时严格。
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # package.json 的 packageManager 锁定 pnpm@11.8.0，corepack 按它激活。
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      - name: Biome lint (libs)
        run: cd libs && pnpm install --frozen-lockfile && pnpm exec biome check .

  check-wasm:
    needs: select_runner
    runs-on: ${{ fromJSON(needs.select_runner.outputs.runner) }}
    # 非 tag 时整个检查 job 允许失败（不阻断下游 build）；tag 时严格。
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v7

      # dtolnay/rust-toolchain：走 GitHub CDN，比 curl|sh 快 ~10-15s。
      # CI runner 在美国/欧洲，不配 rsproxy（国内镜像从国外访问反而更慢）。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Swatinem/rust-cache：prefix 与 test job（host target）隔离。
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: wasm

      # wasm32 目标单独 check，覆盖 web 特性的编译（无需 dx，由 build 阶段容器内 dx 全量构建兜底）。
      - name: WASM target check
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features web

  # ── build-amd64：Docker in-container 全量构建（libs/WASM/rustdoc/静态 musl server）──
  # GitHub x86_64 runner，原生 Dockerfile（非 Dockerfile.cross），宿主仅需 Docker。
  # 每次推送都跑（= 编译验证）。用 cargo-chef + GHA 层缓存：依赖不变时
  # cooker 层 cache-hit(秒级),cargo build 只编 app(~2min)。
  build-amd64:
    runs-on: ${{ fromJSON(needs.select_runner.outputs.runner) }}
    needs: [select_runner, test, lint-js, check-wasm]
    # 仅主干分支(main/master) push、tag 推送、手动触发时构建完整镜像。
    # 其他分支/PR 的 push 仅靠 test job(fmt/clippy/wasm32/单测)做门槛，
    # 省下完整 Docker 构建的 CI 分钟与 GHA 缓存配额(多分支并发会快速吃满 10GB)。
    # tag/手动时此 job 是 release/publish-ghcr/deploy 的必需前置，一定运行。
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
          && (startsWith(github.ref, 'refs/tags/')
              || github.ref == 'refs/heads/main'
              || github.ref == 'refs/heads/master'))
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 直调 docker buildx（不走 make docker-amd64）以加 GHA 层缓存。
      # cache-to/from type=gha：BuildKit 层经 GitHub Actions cache 服务跨 run 持久化。
      # mode=max：缓存所有中间层（含 cargo-chef cooker 层），不只是最终镜像层。
      # scope=amd64：与 arm64 的 GHA cache 隔离（同仓 10GB 上限内各自一份）。
      - name: Build amd64 image
        run: |
          GIT_DESCRIBE="$(git describe --tags --always --dirty 2>/dev/null || echo '')"
          GIT_HASH="$(git rev-parse HEAD 2>/dev/null || echo '')"
          GIT_DATE="$(git log -1 --format=%cd --date=iso-strict 2>/dev/null || echo '')"
          docker buildx build --platform linux/amd64 --load \
            --build-arg YGG_BUILD_GIT_DESCRIBE="$GIT_DESCRIBE" \
            --build-arg YGG_BUILD_GIT_HASH="$GIT_HASH" \
            --build-arg YGG_BUILD_GIT_COMMIT_DATE="$GIT_DATE" \
            --cache-from type=gha,scope=amd64 \
            --cache-to type=gha,scope=amd64,mode=max \
            -t yggdrasil:amd64 .

      - name: Verify image architecture
        run: |
          arch=$(docker image inspect yggdrasil:amd64 --format '{{.Architecture}}')
          echo "image arch: $arch"
          [ "$arch" = "amd64" ] || { echo "expected amd64"; exit 1; }

      # 镜像启动冒烟测试：编译只证明"能 build"，这里验证容器真的能启动。
      # scratch 镜像无 Postgres，容器会在 ensure_database() 阶段失败(预期)。
      # 设 MIGRATE_STARTUP_TIMEOUT_SECS=2 让它 ~2s 内快速失败(而非默认 30s 重试)。
      # 验证两点：(1) 启动横幅 "running database migrations" → 二进制可执行、
      #   tracing/build_info 初始化正常、镜像架构匹配；(2) "failed to ensure target
      #   database exists" → 启动流程完整走到 DB 连接阶段(非更早的 config panic)。
      - name: Smoke test (container boot)
        run: |
          docker run -d --name smoke -e MIGRATE_STARTUP_TIMEOUT_SECS=2 yggdrasil:amd64
          # 轮询容器退出(已设 2s 超时，最多再等 10s 兜底网络/调度延迟)
          for i in $(seq 1 10); do
            [ "$(docker inspect -f '{{.State.Status}}' smoke 2>/dev/null)" = "exited" ] && break
            sleep 1
          done
          docker logs smoke 2>&1 | tee /tmp/smoke.log
          echo "container exit code: $(docker inspect -f '{{.State.ExitCode}}' smoke)"
          docker rm -f smoke >/dev/null
          grep -q "running database migrations" /tmp/smoke.log \
            || { echo "::error::启动横幅缺失，二进制可能无法启动或架构不匹配"; exit 1; }
          grep -q "failed to ensure target database exists" /tmp/smoke.log \
            || { echo "::error::未到达 DB 连接阶段，可能存在更早的配置 panic"; exit 1; }
          echo "smoke: 镜像可启动，初始化流程完整(无 Postgres 时 exit 1 属预期)"

      # 对齐 scripts/xun.fish：tag 成 localhost/yggdrasil:latest 后导出（服务器 load 后即此名）。
      - name: Save amd64 image artifact
        run: |
          docker tag yggdrasil:amd64 localhost/yggdrasil:latest
          mkdir -p /tmp/out
          docker save localhost/yggdrasil:latest | gzip > /tmp/out/yggdrasil-amd64.tar.gz
          ls -lh /tmp/out/yggdrasil-amd64.tar.gz

      - name: Upload amd64 image artifact
        uses: actions/upload-artifact@v7
        with:
          name: yggdrasil-amd64-image
          path: /tmp/out/yggdrasil-amd64.tar.gz
          retention-days: 3
          if-no-files-found: error

      # tag 推送时额外提取 x86_64 musl 静态二进制 + public/ 静态资源（供 release 发布）。
      # scratch 镜像无 shell，docker create + docker cp 只读拷贝层文件即可。
      - name: Extract x86_64 musl binary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p /tmp/musl
          id=$(docker create yggdrasil:amd64)
          docker cp "$id:/app/server" /tmp/musl/yggdrasil
          docker cp "$id:/app/public" /tmp/musl/public
          docker rm "$id"
          tar czf /tmp/musl/yggdrasil-x86_64-musl.tar.gz -C /tmp/musl yggdrasil public
          ls -lh /tmp/musl/yggdrasil-x86_64-musl.tar.gz

      - name: Upload musl binary artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: yggdrasil-x86_64-musl
          path: /tmp/musl/yggdrasil-x86_64-musl.tar.gz
          retention-days: 3
          if-no-files-found: error

  # ── build-arm64：原生 ARM64 runner 构建（2026 最佳实践，零 QEMU）──
  # ubuntu-24.04-arm 是 GitHub 免费提供的原生 ARM64 runner（4 vCPU）。
  # 在上面跑原生 Dockerfile（dpkg --print-architecture=arm64 → aarch64-musl 原生编译），
  # 比 QEMU 交叉编译快 4-8 倍。仅 tag 推送时运行（省 CI 分钟）。
  build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [test, lint-js, check-wasm]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 直接调 docker buildx（无 make docker-arm64 target），原生 Dockerfile 原生编译。
      # git 信息透传与 Makefile 的 GIT_BUILD_ARGS 一致。
      # GHA 层缓存(scope=arm64 与 amd64 隔离)：cargo-chef cooker 层跨 run 复用。
      - name: Build arm64 image
        run: |
          GIT_DESCRIBE="$(git describe --tags --always --dirty 2>/dev/null || echo '')"
          GIT_HASH="$(git rev-parse HEAD 2>/dev/null || echo '')"
          GIT_DATE="$(git log -1 --format=%cd --date=iso-strict 2>/dev/null || echo '')"
          docker buildx build --platform linux/arm64 --load \
            --build-arg YGG_BUILD_GIT_DESCRIBE="$GIT_DESCRIBE" \
            --build-arg YGG_BUILD_GIT_HASH="$GIT_HASH" \
            --build-arg YGG_BUILD_GIT_COMMIT_DATE="$GIT_DATE" \
            --cache-from type=gha,scope=arm64 \
            --cache-to type=gha,scope=arm64,mode=max \
            -t yggdrasil:arm64 .

      - name: Verify image architecture
        run: |
          arch=$(docker image inspect yggdrasil:arm64 --format '{{.Architecture}}')
          echo "image arch: $arch"
          [ "$arch" = "arm64" ] || { echo "expected arm64"; exit 1; }

      - name: Save arm64 image artifact
        run: |
          mkdir -p /tmp/out
          docker save yggdrasil:arm64 | gzip > /tmp/out/yggdrasil-arm64.tar.gz
          ls -lh /tmp/out/yggdrasil-arm64.tar.gz

      - name: Upload arm64 image artifact
        uses: actions/upload-artifact@v7
        with:
          name: yggdrasil-arm64-image
          path: /tmp/out/yggdrasil-arm64.tar.gz
          retention-days: 3
          if-no-files-found: error

  # ── release：收集三件产物创建 GitHub Release（仅 tag 推送）──
  # 产物：amd64 docker 镜像 + arm64 docker 镜像 + x86_64 musl 二进制（含 public/ 资源）
  # body 取 CHANGELOG.md 对应版本段，与手动创建的 release 格式一致。
  release:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/assets

      # 整理产物到统一目录 + 打印清单。
      - name: Stage release assets
        run: |
          mkdir -p /tmp/release
          cp /tmp/assets/yggdrasil-amd64-image/yggdrasil-amd64.tar.gz     /tmp/release/
          cp /tmp/assets/yggdrasil-arm64-image/yggdrasil-arm64.tar.gz     /tmp/release/
          cp /tmp/assets/yggdrasil-x86_64-musl/yggdrasil-x86_64-musl.tar.gz /tmp/release/
          echo "=== release assets ==="
          ls -lh /tmp/release/

      # 从 CHANGELOG.md 提取对应版本段（## [x.y.z] ... 下一个 ## 之前）作为 release body。
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"  # v0.8.2 → 0.8.2
          python3 -c "
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md').read()
          pattern = re.compile(rf'(## \[{re.escape(version)}\][^\n]*\n.*?)(?=\n## |\Z)', re.DOTALL)
          m = pattern.search(text)
          body = m.group(1).strip() if m else f'Release {version}'
          open('/tmp/release-body.md', 'w').write(body + '\n')
          " "$VERSION"
          echo "--- body preview ---"
          head -5 /tmp/release-body.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-body.md \
            /tmp/release/yggdrasil-amd64.tar.gz \
            /tmp/release/yggdrasil-arm64.tar.gz \
            /tmp/release/yggdrasil-x86_64-musl.tar.gz

  # ── publish-ghcr：合并 amd64 + arm64 为多架构 manifest 推 GHCR（部署镜像源）──
  # 每次 tag 或手动触发归档一个多架构 manifest，tag 命名 latest(最新) / vX.Y.Z(git tag) /
  # sha-xxxxxxx(可追溯某次构建)。下方 deploy job 直接从 GHCR 拉取 latest 部署到 xun
  # （pull-based，不再 scp tarball），故本 job 是部署链路的前置依赖（deploy needs: publish-ghcr）。
  # 流程：下载两个单架构 artifact → load → retag → push 单架构(带 sha 后缀) →
  # docker manifest create 合并(从 registry 引用) → push manifest list。
  publish-ghcr:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || github.event_name == 'workflow_dispatch'
    permissions:
      packages: write
    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: yggdrasil-*-image
          path: /tmp/img

      # amd64 artifact 内 tag 为 localhost/yggdrasil:latest(对齐 xun.fish 的 load 名)，
      # arm64 artifact 内 tag 为 yggdrasil:arm64。load 后统一 retag 成 yggdrasil:<arch>，
      # 便于后续 manifest create 引用。
      - name: Load and retag per-arch images
        run: |
          docker load --input /tmp/img/yggdrasil-amd64-image/yggdrasil-amd64.tar.gz
          docker load --input /tmp/img/yggdrasil-arm64-image/yggdrasil-arm64.tar.gz
          docker tag localhost/yggdrasil:latest yggdrasil:amd64
          echo "--- loaded images ---"
          docker image ls --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}'
          # .Architecture 属镜像 config 字段，docker image ls 的 imageContext 无此字段，
          # 必须用 docker image inspect 取（与 build job 的 Verify image architecture 一致）。
          echo "--- arch verification ---"
          docker image inspect yggdrasil:amd64 --format 'yggdrasil:amd64 -> {{.Architecture}}'
          docker image inspect yggdrasil:arm64 --format 'yggdrasil:arm64 -> {{.Architecture}}'

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 镜像名必须全小写(owner DefectingCat → defectingcat)，否则 push 被拒。
      # 推送顺序：先 push 两个单架构(sha 后缀唯一可追溯) → manifest create 合并 → push。
      - name: Push multi-arch manifest to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/yggdrasil"
          SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          docker tag yggdrasil:amd64 "${IMAGE}:sha-${SHA}-amd64"
          docker tag yggdrasil:arm64 "${IMAGE}:sha-${SHA}-arm64"
          docker push "${IMAGE}:sha-${SHA}-amd64"
          docker push "${IMAGE}:sha-${SHA}-arm64"
          TAGS="latest sha-${SHA}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] && TAGS="${TAGS} ${GITHUB_REF_NAME}"
          for t in $TAGS; do
            docker manifest create "${IMAGE}:${t}" \
              "${IMAGE}:sha-${SHA}-amd64" "${IMAGE}:sha-${SHA}-arm64"
            docker manifest push "${IMAGE}:${t}"
            echo "==> pushed ${IMAGE}:${t}"
          done

  # ── publish-runners：构建 6 个 Code Runner 沙箱镜像推 GHCR（归档）──
  # runner 与宿主架构强绑定(代码执行环境)，xun 是 x86_64，故只构建/推 amd64。
  # 构建顺序：base 必须先(其余 5 个 FROM yggdrasil-runner-base:latest)。
  # 用普通 `docker build` 而非 buildx：docker-container driver 的 buildx 实例与本地
  # daemon 隔离，本地 load 的 base 在 buildx 里不可见，子镜像 FROM 会失败；普通
  # docker build 走本地 daemon，base 先进 daemon，子镜像 FROM 即可解析。
  # 下方 deploy job 从 GHCR 拉取这 6 个 runner 镜像并 tag 成 LANGUAGES 注册表硬编码的
  # 短名（best-effort，拉取失败仅保留旧 tag）。本地构建+scp 兜底见 scripts/xun.fish。
  publish-runners:
    runs-on: ubuntu-latest
    needs: [test, lint-js, check-wasm]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || github.event_name == 'workflow_dispatch'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要 tag 历史做与前一个 tag 的 docker/ diff；浅克隆拿不到祖先 tag。
          fetch-depth: 0

      # 变更检测：tag push 时比较与前一个 tag 的 docker/ 变更，无变更则跳过 6 个镜像构建。
      # workflow_dispatch(手动触发)通常是有意重建，总是运行。fetch-depth: 0 提供祖先 tag。
      - name: Detect docker/ changes since last tag
        id: changes
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${PREV_TAG}..${GITHUB_SHA}" -- docker/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::docker/ 自 ${PREV_TAG} 起无变更，跳过沙箱镜像构建"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to GHCR
        if: steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runner images
        if: steps.changes.outputs.changed == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          REG="ghcr.io/${OWNER}"
          SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          TAGS="latest sha-${SHA}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] && TAGS="${TAGS} ${GITHUB_REF_NAME}"
          docker build --platform linux/amd64 -t yggdrasil-runner-base docker/runner-base
          for img in base python node go rust bun; do
            [ "$img" != "base" ] && docker build --platform linux/amd64 -t "yggdrasil-runner-${img}" "docker/runner-${img}"
            for t in $TAGS; do
              docker tag "yggdrasil-runner-${img}" "${REG}/yggdrasil-runner-${img}:${t}"
              docker push "${REG}/yggdrasil-runner-${img}:${t}"
            done
            echo "==> pushed ${REG}/yggdrasil-runner-${img} ← ${TAGS}"
          done

  # ── deploy：xun 从 GHCR 拉取镜像后滚动重启（pull-based，不再 scp tarball）──
  # 仅 push 新 tag（v*）或手动触发时运行（分支推送/PR 不部署）。
  # 依赖 publish-ghcr + publish-runners：镜像须先入 GHCR 才能拉取（两者并行构建，
  # deploy 等它们都完成以避免拉取与推送并发竞争同一 tag）。
  #   - 主应用：publish-ghcr 推 multi-arch manifest(latest)，xun(amd64) 拉取自动解析到
  #     amd64，再 tag 成 localhost/yggdrasil:latest（xun 的 compose app.image 即此名，无需改 compose）。
  #   - runner：publish-runners 推 amd64 单架构，拉取后 tag 成 LANGUAGES 注册表硬编码的
  #     短名 yggdrasil-runner-*:latest（无 registry 前缀）。runner 拉取 best-effort——失败
  #     仅告警保留旧 tag，绝不阻断 app 部署（app 上线是关键路径）。
  # 仓库 public → GHCR 包默认 public，匿名拉取即可；若设为 private，在 xun 上一次性
  # `docker login ghcr.io`（PAT read:packages）即可，CI 无需改动。拉取带 3 次重试
  # （xun 中国网络访问 ghcr.io 偶发超时）。本地构建+scp 兜底仍见 scripts/xun.fish。
  deploy:
    runs-on: ubuntu-latest
    needs: [publish-ghcr, publish-runners]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || github.event_name == 'workflow_dispatch'
    steps:
      - name: Configure SSH
        env:
          XUN_SSH_KEY: ${{ secrets.XUN_SSH_KEY }}
          XUN_HOST: ${{ secrets.XUN_HOST }}
          XUN_KNOWN_HOSTS: ${{ secrets.XUN_KNOWN_HOSTS }}
        run: |
          : "${XUN_SSH_KEY:?secret XUN_SSH_KEY 未设置}"
          : "${XUN_HOST:?secret XUN_HOST 未设置}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$XUN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$XUN_KNOWN_HOSTS" ]; then
            printf '%s\n' "$XUN_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::XUN_KNOWN_HOSTS 未设置，改用 ssh-keyscan（TOFU，建议改为 pin 指纹）"
            ssh-keyscan -H "$XUN_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      # 整段部署脚本以 quoted heredoc（<<'REMOTE'）经 ssh 管道送入 xun 的 bash -s，
      # 脚本体不在 runner 侧展开（\$img/\$i 等全留给远端 bash 求值）；REG/部署目录作为
      # 位置参数 $1/$2 传入——绕开 xun 的 fish 默认 shell + 嵌套引号转义地狱。
      - name: Pull images from GHCR and restart app
        env:
          XUN_USER: ${{ secrets.XUN_USER }}
          XUN_HOST: ${{ secrets.XUN_HOST }}
          XUN_PORT: ${{ secrets.XUN_PORT }}
          XUN_DEPLOY_DIR: ${{ secrets.XUN_DEPLOY_DIR }}
          OWNER: ${{ github.repository_owner }}
        run: |
          : "${XUN_USER:?secret XUN_USER 未设置}"
          port="${XUN_PORT:-22}"
          dir="${XUN_DEPLOY_DIR:-/root/docker/yggdrasil}"
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          ssh -p "$port" -o BatchMode=yes "${XUN_USER}@${XUN_HOST}" 'bash -s' "ghcr.io/${owner}" "${dir}" <<'REMOTE'
          set -euo pipefail
          REG="$1"
          DIR="$2"

          # 带重试的拉取：xun(中国) 访问 ghcr.io 偶发超时。
          pull_retry() {
            local img="$1" i
            for i in 1 2 3; do
              docker pull "$img" && return 0
              echo "  pull retry $i/3: $img"
              sleep 5
            done
            return 1
          }

          echo "==> [1/3] pull + tag app image (multi-arch latest → amd64)"
          pull_retry "$REG/yggdrasil:latest" \
            || { echo "::error::app image pull failed: $REG/yggdrasil:latest"; exit 1; }
          docker tag "$REG/yggdrasil:latest" localhost/yggdrasil:latest

          echo "==> [2/3] docker compose up -d app (postgres 与数据卷不动)"
          cd "$DIR" && docker compose --env-file .env up -d app

          echo "==> [3/3] pull + tag runner images (best-effort，保留旧 tag 不阻断 app)"
          for img in base python node go rust bun; do
            if pull_retry "$REG/yggdrasil-runner-$img:latest"; then
              docker tag "$REG/yggdrasil-runner-$img:latest" "yggdrasil-runner-$img:latest"
              echo "  updated yggdrasil-runner-$img"
            else
              echo "  WARN: pull failed yggdrasil-runner-$img，保留现有 tag"
            fi
          done

          echo "==> pull-based deploy script done"
          REMOTE

      # 轮询内部健康端点（经 nginx-proxy 容器访问 app:3000），最多等 ~60s。
      - name: Health check
        env:
          XUN_USER: ${{ secrets.XUN_USER }}
          XUN_HOST: ${{ secrets.XUN_HOST }}
          XUN_PORT: ${{ secrets.XUN_PORT }}
        run: |
          : "${XUN_USER:?secret XUN_USER 未设置}"
          port="${XUN_PORT:-22}"
          ok=0
          for i in $(seq 1 12); do
            echo "health probe #$i ..."
            if ssh -p "$port" -o BatchMode=yes "${XUN_USER}@${XUN_HOST}" \
                 'docker exec nginx-proxy curl -sf http://yggdrasil-app:3000/readyz' >/dev/null 2>&1; then
              ok=1
              echo "readyz OK"
              break
            fi
            sleep 5
          done
          [ "$ok" = "1" ] || { echo "::error::app /readyz 在 60s 内未就绪"; exit 1; }
          # 容器状态快照（postgres healthy + app up）
          ssh -p "$port" -o BatchMode=yes "${XUN_USER}@${XUN_HOST}" \
            'docker ps --filter name=yggdrasil --format "{{.Names}}\t{{.Status}}"'
