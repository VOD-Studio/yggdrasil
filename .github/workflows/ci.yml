name: CI

# 流水线（2026 runner fallback + 原生多 runner 构建，零 QEMU）：
# - 触发范围：pull_request、master push、v* tag、手动触发；其余分支 push 不触发（靠 PR 检查）。
# - 受信任的 master push、tag 和 master 上的手动触发：x64 检查/amd64 构建优先尝试组织 self-hosted；
#   runner 不可用、API 无权限或 runner group 未允许公开仓库时自动回退 ubuntu-latest。
#   仓库变量 CI_RUNNER_MODE 可手动控制（Settings → Secrets and variables → Actions → Variables）：
#     auto（默认/未设置）按上述探测；github 强制 GitHub-hosted；self-hosted 跳过探测直接用组织 runner。
#     无论取值，PR 和非 master 的手动触发都不会使用 self-hosted。
# - pull_request 和非 master 的手动触发始终使用 GitHub-hosted runner：本仓库公开，避免不受信任代码污染持久 runner。
# - release/publish/deploy 保持 GitHub-hosted：这些 job 使用写权限或部署密钥，不把 secrets 带到持久 runner。
# - arm64 构建保持 ubuntu-24.04-arm（组织 runner-1 是 X64，不能替代）。
# - tag 推送：检查 → build-amd64 → publish-amd64-ghcr + publish-runners → deploy-gate → deploy-xun/deploy-rua；
#   同时 build-arm64 → release + publish-ghcr。
# - master 上的 dispatch：检查 → build-amd64 → publish-amd64-ghcr + publish-runners → deploy
#   （不发 Release，不更新 latest 多架构清单）。
# - 非 master 的 dispatch：只跑检查和 build-amd64。
# - PR：只跑检查，不构建镜像。
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# tag 和 dispatch 的运行永不被取消；dispatch 与 master push 分到不同组，互不取消。
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  # ── runner selection：仅在 hosted runner 上查询，避免 self-hosted 离线时 job 排队 ──
  # ORG_RUNNER_TOKEN 可作为 repo/org secret 提供；需要读取组织 runner/group 的权限。
  # 缺少 token、API 失败、runner 忙/离线或公开仓库未获 runner group 授权时均安全回退。
  # CI_RUNNER_MODE（repo/org variable）：auto | github | self-hosted。强制 self-hosted 时不探测，
  # runner 离线则 job 会一直排队，需手动改回 auto/github 后重跑。
  select_runner:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
      - name: Choose x64 runner
        id: choose
        env:
          GH_TOKEN: ${{ secrets.ORG_RUNNER_TOKEN || github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUNNER_MODE: ${{ vars.CI_RUNNER_MODE || 'auto' }}
        run: |
          runner='["ubuntu-latest"]'
          reason="default GitHub-hosted runner"
          trusted_ref=false

          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" || "$GITHUB_REF" == refs/tags/* ) ]]; then
            trusted_ref=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            trusted_ref=true
          fi

          RUNNER_MODE="$(echo "$RUNNER_MODE" | tr '[:upper:]' '[:lower:]' | xargs)"
          case "$RUNNER_MODE" in
            auto|github|self-hosted) ;;
            *)
              echo "::warning::CI_RUNNER_MODE='$RUNNER_MODE' 无效（可选 auto|github|self-hosted），按 auto 处理"
              RUNNER_MODE=auto
              ;;
          esac

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            reason="public pull request"
          elif [[ "$trusted_ref" != true ]]; then
            reason="untrusted branch push"
          elif [[ "$RUNNER_MODE" == "github" ]]; then
            reason="CI_RUNNER_MODE=github"
          elif [[ "$RUNNER_MODE" == "self-hosted" ]]; then
            runner='["self-hosted","Linux","X64"]'
            reason="CI_RUNNER_MODE=self-hosted (availability check skipped)"
          else
            # visible_to_repository 对 public repo 返回空(GitHub API 已知行为)，改查全部 group 再按 allows_public_repositories 过滤
            if group_ids="$(gh api --paginate "orgs/${GITHUB_REPOSITORY_OWNER}/actions/runner-groups?per_page=100" --jq '.runner_groups[] | select(.visibility == "all" and .allows_public_repositories == true) | .id' 2>/dev/null)"; then
              available=false
              while IFS= read -r group_id; do
                [[ -z "$group_id" ]] && continue
                if group_runner="$(gh api --paginate "orgs/${GITHUB_REPOSITORY_OWNER}/actions/runner-groups/${group_id}/runners?per_page=100" --jq '
                  .runners[] |
                  select(.status == "online" and .busy == false and
                    ([.labels[].name | ascii_downcase] | index("self-hosted") != null) and
                    ([.labels[].name | ascii_downcase] | index("linux") != null) and
                    ([.labels[].name | ascii_downcase] | index("x64") != null)) |
                  "available"
                ' 2>/dev/null)"; then
                  if [[ -n "$group_runner" ]]; then
                    available=true
                    break
                  fi
                fi
              done <<< "$group_ids"

              if [[ "$available" == true ]]; then
                runner='["self-hosted","Linux","X64"]'
                reason="online and idle organization self-hosted runner"
              else
                reason="no online and idle matching self-hosted runner"
              fi
            else
              echo "::warning::无法读取组织 runner/group 状态；请配置 ORG_RUNNER_TOKEN，回退 GitHub-hosted runner"
              reason="runner status API unavailable"
            fi
          fi

          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "::notice::x64 runner selected: $runner ($reason)"

  # ── 检查阶段：拆成 3 个并行 job（按工具链与产物共享切分）──
  # 原 test job 串行跑 fmt/clippy/wasm/biome/test。cargo 对 target/ 持排他锁，同 job 内
  # 并行无效；真正并行只能拆 job（多 runner）。按「能否真正并行 / 是否共享产物」切分：
  #   test       — fmt + clippy + cargo test（clippy 只做 check（rmeta），不产出可链接产物，
  #                cargo test 仍需编译；三步放同一 job 是为共享依赖缓存与 target/）
  #   lint-js    — Biome + TypeScript + Vitest（仅 Bun，不装 Rust）
  #   check-wasm — wasm32 check（hydrate feature + 独立 triple，与 server 产物不相交）
  #   test-db    — 真实 PostgreSQL 回归（固定 GitHub-hosted，见下方说明）
  # 两个 cargo job 用独立 cache key 后缀（-rust- / -wasm-），避免并行写同一 GHA cache key
  # 每次 push / PR 都严格执行检查，失败即阻断下游构建与发布。
  test:
    needs: select_runner
    runs-on: ${{ fromJSON(needs.select_runner.outputs.runner) }}
    timeout-minutes: 45
    steps:
      # dtolnay/rust-toolchain：走 GitHub CDN，比 curl|sh 快 ~10-15s，含 clippy+rustfmt 组件。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Swatinem/rust-cache：cache key 自动含 rustc 版本 + Cargo.lock hash，
      # 防止 toolchain 升级后命中过期缓存（旧手动方案会命中 → 全量重编）。
      # prefix 区分 test（host target）与 check-wasm（wasm32 target），避免缓存互踩。仅 master 写缓存，PR/tag 只读。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: rust
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy (all targets)
        run: cargo clippy --locked --all-targets -- -D warnings

      # clippy 只做 check（rmeta），不产出可链接产物，cargo test 仍需编译；三步放同一 job 是为共享依赖缓存与 target/。
      - name: Run tests
        run: cargo test --locked

  # ── test-db：真实 PostgreSQL 回归固定在 GitHub-hosted runner ──
  # 需要 sudo 安装与服务端主版本一致的 pg_dump/psql；self-hosted runner 以
  # no-new-privileges 容器运行，sudo 不可用，因此不走 select_runner。
  test-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: rust-db
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install matching PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Article, notes and backup database regressions
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/test-databases.sh

  lint-js:
    needs: select_runner
    runs-on: ${{ fromJSON(needs.select_runner.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 版本取自 libs/package.json 的 packageManager 字段（bun@x.y.z），与本地、Docker 保持一致。
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: libs/package.json

      - name: Install frontend dependencies
        run: cd libs && bun install --frozen-lockfile

      - name: Biome lint (libs)
        run: cd libs && bun run lint

      - name: Frontend and Bun script type check
        run: cd libs && bun run typecheck

      - name: Frontend tests
        run: cd libs && bun run --sequential --filter '*' test

  check-wasm:
    needs: select_runner
    runs-on: ${{ fromJSON(needs.select_runner.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # dtolnay/rust-toolchain：走 GitHub CDN，比 curl|sh 快 ~10-15s。
      # CI runner 在美国/欧洲，不配 rsproxy（国内镜像从国外访问反而更慢）。
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy

      # Swatinem/rust-cache：prefix 与 test job（host target）隔离；仅 master 写缓存，PR/tag 只读。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: wasm
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # 浏览器目标的 clippy 同时完成编译检查（hydrate feature，无 server）。test job 的
      # clippy 是原生 target，#[cfg(target_arch = "wasm32")] 门控的代码（含 src/bridges
      # 的 wasm 子模块）完全不会被那边编译到，所以这里单独 lint。
      - name: Clippy (wasm32 hydrate)
        run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features hydrate -- -D warnings

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny (advisories, sources)
        run: cargo deny check advisories sources

  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum -c -
          mkdir -p actionlint-bin
          tar -xzf actionlint.tar.gz -C actionlint-bin actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: actionlint
        run: actionlint -color

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: browser
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: libs/package.json
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-leptos@0.3.11
      - name: Install browser build tools
        run: |
          sudo curl -fsSL --retry 3 https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64 -o /usr/local/bin/tailwindcss
          sudo chmod +x /usr/local/bin/tailwindcss
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          cd libs
          bun install --frozen-lockfile
          bun run playwright install --with-deps chromium
      - name: Build browser regression application
        run: make regression-build
      - name: Build Python regression runner
        run: |
          docker build -t yggdrasil-runner-base:latest docker/runner-base
          docker build -t yggdrasil-runner-python:latest docker/runner-python
      - name: Isolated browser acceptance
        run: |
          make test-browser BROWSER_SUITE=smoke
          make test-browser BROWSER_SUITE=admin
          make test-browser BROWSER_SUITE=notes
          make test-browser BROWSER_SUITE=backup
          make test-browser BROWSER_SUITE=runner
          make test-browser BROWSER_SUITE=slash
          make test-browser BROWSER_SUITE=showcase
          make test-browser BROWSER_SUITE=lightbox
          bun scripts/test-public-performance.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-regressions
          path: target/regressions/

  # ── release-split：真实 release 产物验收（分包、水合、SSR 缓存、滚动发布兜底、体积门槛）──
  # make build 走与 Docker 相同的流水线（固定 nightly + build-std + cargo-leptos --split），
  # test-release-split.ts 再起临时 PostgreSQL 与 release 服务端做 Playwright 断言。
  # PR 也跑：体积门槛与分包粒度只有真实 release 构建才能验证。
  release-split:
    needs: [select_runner]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install pinned nightly for the release WASM build
        run: make wasm-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: release-split
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: libs/package.json
      # release 前端要用分包合并补丁版 cargo-leptos（Makefile 的 CARGO_LEPTOS_INSTALL），
      # 没有预编译包；按补丁 rev 缓存编好的二进制，rev 变了才重新编译。
      - name: Read wasm-split patch rev
        id: wasm-split
        run: echo "rev=$(sed -n 's/^WASM_SPLIT_REV := //p' Makefile)" >> "$GITHUB_OUTPUT"
      - name: Cache patched cargo-leptos
        id: cargo-leptos-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-leptos
          key: cargo-leptos-0.3.11-${{ runner.os }}-${{ steps.wasm-split.outputs.rev }}
      - name: Install patched cargo-leptos
        if: steps.cargo-leptos-cache.outputs.cache-hit != 'true'
        run: make install-cargo-leptos
      - name: Install release build tools
        run: |
          sudo curl -fsSL --retry 3 https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64 -o /usr/local/bin/tailwindcss
          sudo chmod +x /usr/local/bin/tailwindcss
          sudo apt-get update
          sudo apt-get install -y postgresql-common brotli
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          cd libs
          bun install --frozen-lockfile
          bun run playwright install --with-deps chromium
      - name: Build diagnostic gate regressions
        run: bun test scripts/check-build.test.ts
      - name: Release build (no warnings or errors)
        run: bun scripts/check-build.ts
      - name: Release split acceptance
        run: bun scripts/test-release-split.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-split-regressions
          path: target/regressions/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-build-log
          path: target/build.log

  # ── build-amd64：Docker in-container 全量构建（libs/WASM/rustdoc/静态 musl server）──
  # GitHub x86_64 runner，原生 Dockerfile（非 Dockerfile.cross），宿主仅需 Docker。
  # PR 之外的每次运行都跑（= 编译验证）。用 cargo-chef + GHA 层缓存：依赖不变时
  # cooker 层 cache-hit(秒级),cargo build 只编 app(~2min)。
  build-amd64:
    runs-on: ${{ fromJSON(needs.select_runner.outputs.runner) }}
    needs: [select_runner, test, test-db, lint-js, check-wasm, browser, release-split, audit, lint-workflows]
    timeout-minutes: 60
    # PR 不构建完整镜像，仅靠检查 job 做门槛，省下 CI 分钟与 GHA 缓存配额。
    # master push、tag、任意分支手动触发都构建（= 编译验证）；
    # tag/master 手动触发时此 job 是 release/publish/deploy 的必需前置，一定运行。
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # 直调 docker buildx（不走 make docker-amd64）以加 GHA 层缓存。
      # cache-to/from type=gha：BuildKit 层经 GitHub Actions cache 服务跨 run 持久化。
      # mode=max：缓存所有中间层（含 cargo-chef cooker 层），不只是最终镜像层。
      # scope=amd64：与 arm64 的 GHA cache 隔离（同仓 10GB 上限内各自一份）。
      - name: Build amd64 image
        run: |
          GIT_DESCRIBE="$(git describe --tags --always --dirty 2>/dev/null || echo '')"
          GIT_HASH="$(git rev-parse HEAD 2>/dev/null || echo '')"
          GIT_DATE="$(git log -1 --format=%cd --date=iso-strict 2>/dev/null || echo '')"
          docker buildx build --platform linux/amd64 --load \
            --build-arg YGG_BUILD_GIT_DESCRIBE="$GIT_DESCRIBE" \
            --build-arg YGG_BUILD_GIT_HASH="$GIT_HASH" \
            --build-arg YGG_BUILD_GIT_COMMIT_DATE="$GIT_DATE" \
            --cache-from type=gha,scope=amd64 \
            --cache-to type=gha,scope=amd64,mode=max \
            -t yggdrasil:amd64 .

      - name: Verify image architecture
        run: |
          arch=$(docker image inspect yggdrasil:amd64 --format '{{.Architecture}}')
          echo "image arch: $arch"
          [ "$arch" = "amd64" ] || { echo "expected amd64"; exit 1; }

      # 镜像启动冒烟测试：编译只证明"能 build"，这里验证容器真的能启动。
      # scratch 镜像无 Postgres，容器会在 ensure_database() 阶段失败(预期)。
      # 设 MIGRATE_STARTUP_TIMEOUT_SECS=2 让它 ~2s 内快速失败(而非默认 30s 重试)。
      # 验证两点：(1) 启动横幅 "running database migrations" → 二进制可执行、
      #   tracing/build_info 初始化正常、镜像架构匹配；(2) "failed to ensure target
      #   database exists" → 启动流程完整走到 DB 连接阶段(非更早的 config panic)。
      - name: Smoke test (container boot)
        run: |
          docker run -d --name smoke -e MIGRATE_STARTUP_TIMEOUT_SECS=2 yggdrasil:amd64
          # 轮询容器退出(已设 2s 超时，最多再等 10s 兜底网络/调度延迟)
          for _ in $(seq 1 10); do
            [ "$(docker inspect -f '{{.State.Status}}' smoke 2>/dev/null)" = "exited" ] && break
            sleep 1
          done
          docker logs smoke 2>&1 | tee /tmp/smoke.log
          echo "container exit code: $(docker inspect -f '{{.State.ExitCode}}' smoke)"
          docker rm -f smoke >/dev/null
          grep -q "running database migrations" /tmp/smoke.log \
            || { echo "::error::启动横幅缺失，二进制可能无法启动或架构不匹配"; exit 1; }
          grep -q "failed to ensure target database exists" /tmp/smoke.log \
            || { echo "::error::未到达 DB 连接阶段，可能存在更早的配置 panic"; exit 1; }
          echo "smoke: 镜像可启动，初始化流程完整(无 Postgres 时 exit 1 属预期)"

      # tag 成 localhost/yggdrasil:latest 后导出（服务器 load 后即此名）。
      - name: Save amd64 image artifact
        run: |
          docker tag yggdrasil:amd64 localhost/yggdrasil:latest
          mkdir -p /tmp/out
          docker save localhost/yggdrasil:latest | gzip > /tmp/out/yggdrasil-amd64.tar.gz
          ls -lh /tmp/out/yggdrasil-amd64.tar.gz

      - name: Upload amd64 image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yggdrasil-amd64-image
          path: /tmp/out/yggdrasil-amd64.tar.gz
          retention-days: 3
          if-no-files-found: error

      # tag 推送时额外提取 x86_64 musl 静态二进制 + public/ 静态资源（供 release 发布）。
      # scratch 镜像无 shell，docker create + docker cp 只读拷贝层文件即可。
      - name: Extract x86_64 musl binary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p /tmp/musl
          id=$(docker create yggdrasil:amd64)
          docker cp "$id:/app/server" /tmp/musl/yggdrasil
          docker cp "$id:/app/public" /tmp/musl/public
          docker rm "$id"
          tar czf /tmp/musl/yggdrasil-x86_64-musl.tar.gz -C /tmp/musl yggdrasil public
          ls -lh /tmp/musl/yggdrasil-x86_64-musl.tar.gz

      - name: Upload musl binary artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yggdrasil-x86_64-musl
          path: /tmp/musl/yggdrasil-x86_64-musl.tar.gz
          retention-days: 3
          if-no-files-found: error

  # ── publish-amd64-ghcr：发布部署专用 amd64 镜像（不等待 arm64 构建）──
  # 部署服务器均使用 amd64，因此部署链路只依赖 build-amd64。使用 commit
  # 专属 tag，避免后续 publish-ghcr 更新 latest 多架构 manifest 时产生竞态。
  publish-amd64-ghcr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-amd64]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    permissions:
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Download amd64 image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: yggdrasil-amd64-image
          path: /tmp/img

      - name: Load amd64 image
        run: docker load --input /tmp/img/yggdrasil-amd64.tar.gz

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push amd64 deployment tag
        id: push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/yggdrasil"
          SHA="${GITHUB_SHA::7}"
          TAG="sha-${SHA}-amd64"
          docker tag localhost/yggdrasil:latest "${IMAGE}:${TAG}"
          docker image inspect "${IMAGE}:${TAG}" --format '{{.Architecture}}' | grep -qx amd64
          docker push "${IMAGE}:${TAG}"
          echo "==> pushed ${IMAGE}:${TAG} (amd64 deployment image)"
          digest="$(docker image inspect "${IMAGE}:${TAG}" --format '{{index .RepoDigests 0}}')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ── build-arm64：原生 ARM64 runner 构建（2026 最佳实践，零 QEMU）──
  # ubuntu-24.04-arm 是 GitHub 免费提供的原生 ARM64 runner（4 vCPU）。
  # 在上面跑原生 Dockerfile（dpkg --print-architecture=arm64 → aarch64-musl 原生编译），
  # 比 QEMU 交叉编译快 4-8 倍。仅 tag 推送时运行（省 CI 分钟）。
  build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [test, test-db, lint-js, check-wasm, browser, audit, lint-workflows]
    timeout-minutes: 60
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # 直接调 docker buildx（无 make docker-arm64 target），原生 Dockerfile 原生编译。
      # git 信息透传与 Makefile 的 GIT_BUILD_ARGS 一致。
      # GHA 层缓存(scope=arm64 与 amd64 隔离)：cargo-chef cooker 层跨 run 复用。
      - name: Build arm64 image
        run: |
          GIT_DESCRIBE="$(git describe --tags --always --dirty 2>/dev/null || echo '')"
          GIT_HASH="$(git rev-parse HEAD 2>/dev/null || echo '')"
          GIT_DATE="$(git log -1 --format=%cd --date=iso-strict 2>/dev/null || echo '')"
          docker buildx build --platform linux/arm64 --load \
            --build-arg YGG_BUILD_GIT_DESCRIBE="$GIT_DESCRIBE" \
            --build-arg YGG_BUILD_GIT_HASH="$GIT_HASH" \
            --build-arg YGG_BUILD_GIT_COMMIT_DATE="$GIT_DATE" \
            --cache-from type=gha,scope=arm64 \
            --cache-to type=gha,scope=arm64,mode=max \
            -t yggdrasil:arm64 .

      - name: Verify image architecture
        run: |
          arch=$(docker image inspect yggdrasil:arm64 --format '{{.Architecture}}')
          echo "image arch: $arch"
          [ "$arch" = "arm64" ] || { echo "expected arm64"; exit 1; }

      # 镜像启动冒烟测试（同 build-amd64）：arm64 runner 原生执行，不需要 QEMU。
      - name: Smoke test (container boot)
        run: |
          docker run -d --name smoke -e MIGRATE_STARTUP_TIMEOUT_SECS=2 yggdrasil:arm64
          # 轮询容器退出(已设 2s 超时，最多再等 10s 兜底网络/调度延迟)
          for _ in $(seq 1 10); do
            [ "$(docker inspect -f '{{.State.Status}}' smoke 2>/dev/null)" = "exited" ] && break
            sleep 1
          done
          docker logs smoke 2>&1 | tee /tmp/smoke.log
          echo "container exit code: $(docker inspect -f '{{.State.ExitCode}}' smoke)"
          docker rm -f smoke >/dev/null
          grep -q "running database migrations" /tmp/smoke.log \
            || { echo "::error::启动横幅缺失，二进制可能无法启动或架构不匹配"; exit 1; }
          grep -q "failed to ensure target database exists" /tmp/smoke.log \
            || { echo "::error::未到达 DB 连接阶段，可能存在更早的配置 panic"; exit 1; }
          echo "smoke: 镜像可启动，初始化流程完整(无 Postgres 时 exit 1 属预期)"

      - name: Save arm64 image artifact
        run: |
          mkdir -p /tmp/out
          docker save yggdrasil:arm64 | gzip > /tmp/out/yggdrasil-arm64.tar.gz
          ls -lh /tmp/out/yggdrasil-arm64.tar.gz

      - name: Upload arm64 image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yggdrasil-arm64-image
          path: /tmp/out/yggdrasil-arm64.tar.gz
          retention-days: 3
          if-no-files-found: error

  # ── release：收集三件产物创建 GitHub Release（仅 tag 推送）──
  # 产物：amd64 docker 镜像 + arm64 docker 镜像 + x86_64 musl 二进制（含 public/ 资源）
  # body 取 CHANGELOG.md 对应版本段，与手动创建的 release 格式一致。
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-amd64, build-arm64]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/assets

      # 整理产物到统一目录 + 打印清单。
      - name: Stage release assets
        run: |
          mkdir -p /tmp/release
          cp /tmp/assets/yggdrasil-amd64-image/yggdrasil-amd64.tar.gz     /tmp/release/
          cp /tmp/assets/yggdrasil-arm64-image/yggdrasil-arm64.tar.gz     /tmp/release/
          cp /tmp/assets/yggdrasil-x86_64-musl/yggdrasil-x86_64-musl.tar.gz /tmp/release/
          echo "=== release assets ==="
          ls -lh /tmp/release/
          (cd /tmp/release && sha256sum yggdrasil-*.tar.gz > SHA256SUMS && cat SHA256SUMS)

      # 从 CHANGELOG.md 提取对应版本段（## [x.y.z] ... 下一个 ## 之前）作为 release body。
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"  # v0.8.2 → 0.8.2
          python3 -c "
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md').read()
          pattern = re.compile(rf'(## \[{re.escape(version)}\][^\n]*\n.*?)(?=\n## |\Z)', re.DOTALL)
          m = pattern.search(text)
          body = m.group(1).strip() if m else f'Release {version}'
          open('/tmp/release-body.md', 'w').write(body + '\n')
          " "$VERSION"
          echo "--- body preview ---"
          head -5 /tmp/release-body.md

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/release/yggdrasil-*.tar.gz

      # 幂等：同 tag 重跑（tag 重发/rerun）时 Release 已存在则跳过创建，
      # 不让「already exists」把发版作业打红——产物已在，无需重复上传。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "==> release ${GITHUB_REF_NAME} 已存在，跳过创建（tag 重发场景）"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-body.md \
            /tmp/release/yggdrasil-amd64.tar.gz \
            /tmp/release/yggdrasil-arm64.tar.gz \
            /tmp/release/yggdrasil-x86_64-musl.tar.gz \
            /tmp/release/SHA256SUMS

  # ── publish-ghcr：合并 amd64 + arm64 为多架构 manifest 推 GHCR（归档）──
  # 每次 tag 归档一个多架构 manifest，tag 命名 latest(最新) / vX.Y.Z(git tag) /
  # sha-xxxxxxx(可追溯某次构建)。部署不等待本 job，而使用 publish-amd64-ghcr
  # 已发布的 commit 专属 amd64 tag；本 job 仅负责多架构镜像归档。
  # buildx imagetools create 合并(从 registry 引用，同时打全部 tag) 并附加来源证明。
  publish-ghcr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-amd64, build-arm64]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: yggdrasil-*-image
          path: /tmp/img

      # amd64 artifact 内 tag 为 localhost/yggdrasil:latest(服务器 load 后即此名)，
      # arm64 artifact 内 tag 为 yggdrasil:arm64。load 后统一 retag 成 yggdrasil:<arch>，
      # 便于后续 manifest create 引用。
      - name: Load and retag per-arch images
        run: |
          docker load --input /tmp/img/yggdrasil-amd64-image/yggdrasil-amd64.tar.gz
          docker load --input /tmp/img/yggdrasil-arm64-image/yggdrasil-arm64.tar.gz
          docker tag localhost/yggdrasil:latest yggdrasil:amd64
          echo "--- loaded images ---"
          docker image ls --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}'
          # .Architecture 属镜像 config 字段，docker image ls 的 imageContext 无此字段，
          # 必须用 docker image inspect 取（与 build job 的 Verify image architecture 一致）。
          echo "--- arch verification ---"
          docker image inspect yggdrasil:amd64 --format 'yggdrasil:amd64 -> {{.Architecture}}'
          docker image inspect yggdrasil:arm64 --format 'yggdrasil:arm64 -> {{.Architecture}}'

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 镜像名必须全小写(owner DefectingCat → defectingcat)，否则 push 被拒。
      # 推送顺序：先 push 两个单架构(sha 后缀唯一可追溯) → imagetools create 合并并打全部 tag。
      - name: Push multi-arch manifest to GHCR
        id: push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/yggdrasil"
          SHA="${GITHUB_SHA::7}"
          docker tag yggdrasil:amd64 "${IMAGE}:sha-${SHA}-amd64"
          docker tag yggdrasil:arm64 "${IMAGE}:sha-${SHA}-arm64"
          docker push "${IMAGE}:sha-${SHA}-amd64"
          docker push "${IMAGE}:sha-${SHA}-arm64"
          docker buildx imagetools create \
            -t "${IMAGE}:latest" -t "${IMAGE}:sha-${SHA}" -t "${IMAGE}:${GITHUB_REF_NAME}" \
            "${IMAGE}:sha-${SHA}-amd64" "${IMAGE}:sha-${SHA}-arm64"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "==> pushed ${IMAGE}:{latest,sha-${SHA},${GITHUB_REF_NAME}} (${digest})"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ── publish-runners：构建 6 个 Code Runner 沙箱镜像推 GHCR（归档）──
  # runner 与宿主架构强绑定(代码执行环境)，xun 是 x86_64，故只构建/推 amd64。
  # 构建顺序：base 必须先(其余 5 个 FROM yggdrasil-runner-base:latest)。
  # 用普通 `docker build` 而非 buildx：docker-container driver 的 buildx 实例与本地
  # daemon 隔离，本地 load 的 base 在 buildx 里不可见，子镜像 FROM 会失败；普通
  # docker build 走本地 daemon，base 先进 daemon，子镜像 FROM 即可解析。
  # 下方 deploy-xun job 从同一个公开 GHCR 包拉取这 6 个 runner 镜像，并 tag 成
  # LANGUAGES 注册表硬编码的短名（runner-* 标签避免独立私有包无法匿名拉取）。
  publish-runners:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test, test-db, lint-js, check-wasm, browser, audit, lint-workflows]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 需要 tag 历史做与前一个 tag 的 docker/ diff；浅克隆拿不到祖先 tag。
          fetch-depth: 0

      # 变更检测前先登录 GHCR：即使 docker/ 未变，也要验证 runner manifest 是否仍存在。
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag push 且 docker/ 未变时，只要 GHCR runner tag 缺失也必须重建，避免归档被删后
      # 部署继续放行。workflow_dispatch 总是重建，fetch-depth: 0 提供祖先 tag。
      - name: Detect docker changes and runner tags
        id: changes
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/yggdrasil"

          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::非 push 事件，重建全部 runner 镜像"
            exit 0
          fi

          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::没有可比较的前一个 tag，重建全部 runner 镜像"
          elif git diff --name-only "${PREV_TAG}..${GITHUB_SHA}" -- docker/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::docker/ 自 ${PREV_TAG} 起有变更，重建全部 runner 镜像"
          else
            missing=()
            for img in base python node go rust bun; do
              if ! docker manifest inspect "$IMAGE:runner-$img" >/dev/null 2>&1; then
                missing+=("$img")
              fi
            done
            if ((${#missing[@]} > 0)); then
              echo "::warning::GHCR runner tag 缺失：${missing[*]}，触发完整重建"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::docker/ 自 ${PREV_TAG} 起无变更且 GHCR runner tag 完整，跳过沙箱镜像构建"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build and push runner images
        if: steps.changes.outputs.changed == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/yggdrasil"
          SHA="${GITHUB_SHA::7}"
          docker build --platform linux/amd64 -t yggdrasil-runner-base docker/runner-base
          for img in base python node go rust bun; do
            [ "$img" != "base" ] && docker build --platform linux/amd64 -t "yggdrasil-runner-${img}" "docker/runner-${img}"
            TAGS="runner-${img} runner-${img}-sha-${SHA}"
            [ "${GITHUB_REF_TYPE}" = "tag" ] && TAGS="${TAGS} runner-${img}-${GITHUB_REF_NAME}"
            for t in $TAGS; do
              docker tag "yggdrasil-runner-${img}" "${IMAGE}:${t}"
              docker push "${IMAGE}:${t}"
            done
            echo "==> pushed ${IMAGE}:runner-${img} (+ sha/tag aliases)"
          done

  # ── deploy-gate：防止旧 tag 的部署晚于新 tag 完成并覆盖线上版本 ──
  # tag 不是最新的 v* 时输出 deploy=false，deploy-xun/deploy-rua 随之跳过；
  # master 上的手动触发不受此限制。
  deploy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [publish-amd64-ghcr, publish-runners]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Skip superseded tag
        id: gate
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v*' \
            | sed 's#.*refs/tags/##' | sort -V | tail -n1)"
          [[ -n "$latest" ]] || { echo "::error::无法列出远端 v* tag"; exit 1; }
          if [[ "$latest" == "$GITHUB_REF_NAME" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::${GITHUB_REF_NAME} 已被 ${latest} 取代，跳过部署"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  # ── deploy-xun：从 GHCR 拉取 amd64 镜像后滚动重启（pull-based）──
  # 仅 push 新 tag（v*）或 master 上手动触发时运行，且需通过 deploy-gate（分支推送/PR 不部署）。
  # 主应用由 publish-amd64-ghcr 提供当前 commit 的 amd64-only tag；runner 由
  # publish-runners 推入同一个公开 yggdrasil 包的 runner-* 标签。部署前必须确认每个
  # runner 已成功拉取或远端已有可用旧 tag；缺失时阻断 app 重启，避免 CI 绿但运行时报 404。
  # 两台按部署目录下的 ROLE 文件（primary|standby，缺省 primary）区分角色：primary 拉镜像后
  # 重建 app 并做健康检查；standby 只预拉并打 tag，不启动 app（热备库只读，app 启动迁移会
  # 直接退出），故障切换脚本改写 ROLE 并启动 app。deploy-rua 排在 deploy-xun 之后。
  deploy-xun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-gate, publish-amd64-ghcr, publish-runners]
    if: needs.deploy-gate.outputs.deploy == 'true'
    environment:
      name: production
    concurrency:
      group: deploy-xun
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          XUN_SSH_KEY: ${{ secrets.XUN_SSH_KEY }}
          XUN_HOST: ${{ secrets.XUN_HOST }}
          XUN_KNOWN_HOSTS: ${{ secrets.XUN_KNOWN_HOSTS }}
        run: |
          : "${XUN_SSH_KEY:?secret XUN_SSH_KEY 未设置}"
          : "${XUN_HOST:?secret XUN_HOST 未设置}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # keepalive：xun 拉镜像期间 SSH 会话长时间无输出，路径上防火墙/NAT 掐掉
          # 空闲连接；30s 加密通道探活，容 10 次未响应（约 5 分钟真断网才放弃）。
          cat > ~/.ssh/config <<'SSHCONF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 10
          SSHCONF
          chmod 600 ~/.ssh/config
          printf '%s\n' "$XUN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : "${XUN_KNOWN_HOSTS:?secret XUN_KNOWN_HOSTS 未设置（拒绝 TOFU）}"
          printf '%s\n' "$XUN_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Detect node role
        id: role
        env:
          XUN_USER: ${{ secrets.XUN_USER }}
          XUN_HOST: ${{ secrets.XUN_HOST }}
          XUN_PORT: ${{ secrets.XUN_PORT }}
          XUN_DEPLOY_DIR: ${{ secrets.XUN_DEPLOY_DIR }}
        run: |
          : "${XUN_USER:?secret XUN_USER 未设置}"
          port="${XUN_PORT:-29888}"
          dir="${XUN_DEPLOY_DIR:-/root/docker/yggdrasil}"
          role="$(ssh -p "$port" -o BatchMode=yes "${XUN_USER}@${XUN_HOST}" 'bash -s' "$dir" \
            <<<'cat "$1/ROLE" 2>/dev/null || echo primary' | tr -d '[:space:]')"
          case "$role" in
            primary|standby) echo "xun role: $role" ;;
            *) echo "::error::xun ROLE 无效：${role:-<空>}"; exit 1 ;;
          esac
          echo "role=$role" >> "$GITHUB_OUTPUT"

      # quoted heredoc 经 ssh 'bash -s' 送入 xun，REG/部署目录/镜像 tag 作为位置参数传入，
      # 绕开 xun 的 fish 默认 shell 与嵌套引号转义问题。
      - name: Pull images from GHCR and restart app
        id: deploy
        env:
          XUN_USER: ${{ secrets.XUN_USER }}
          XUN_HOST: ${{ secrets.XUN_HOST }}
          XUN_PORT: ${{ secrets.XUN_PORT }}
          XUN_DEPLOY_DIR: ${{ secrets.XUN_DEPLOY_DIR }}
          OWNER: ${{ github.repository_owner }}
          ROLE: ${{ steps.role.outputs.role }}
        run: |
          : "${XUN_USER:?secret XUN_USER 未设置}"
          port="${XUN_PORT:-29888}"
          dir="${XUN_DEPLOY_DIR:-/root/docker/yggdrasil}"
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          app_tag="sha-${GITHUB_SHA::7}-amd64"
          ssh -p "$port" -o BatchMode=yes "${XUN_USER}@${XUN_HOST}" 'bash -s' "ghcr.io/${owner}" "${dir}" "${app_tag}" "${ROLE}" <<'REMOTE'
          set -euo pipefail
          REG="$1"
          DIR="$2"
          APP_TAG="$3"
          ROLE="$4"

          # 拉取之前记录当前运行镜像，任何失败点都能据此回滚到本次部署前的版本。
          # standby 没有运行中的 app，保留原记录。
          cd "$DIR"
          if [[ "$ROLE" == primary ]]; then
            prev_id="$(docker inspect yggdrasil-app --format '{{.Image}}' 2>/dev/null || true)"
            printf '%s\n' "$prev_id" > .previous-app-image
            echo "==> previous app image: ${prev_id:-<none>}"
          fi

          # 带重试的拉取：xun(中国)访问 ghcr.io 偶发超时。
          pull_retry() {
            local img="$1" i
            for i in 1 2 3; do
              docker pull "$img" && return 0
              echo "  pull retry $i/3: $img"
              sleep 5
            done
            return 1
          }

          echo "==> [1/3] pull + tag amd64 app image ($APP_TAG)"
          pull_retry "$REG/yggdrasil:$APP_TAG" \
            || { echo "::error::app image pull failed: $REG/yggdrasil:$APP_TAG"; exit 1; }
          docker tag "$REG/yggdrasil:$APP_TAG" localhost/yggdrasil:latest
          docker image inspect localhost/yggdrasil:latest >/dev/null \
            || { echo "::error::app image tag failed: localhost/yggdrasil:latest"; exit 1; }

          echo "==> [2/3] pull + tag runner images (required; missing images block deploy)"
          missing=()
          for img in base python node go rust bun; do
            target="yggdrasil-runner-$img:latest"
            if pull_retry "$REG/yggdrasil:runner-$img"; then
              if docker tag "$REG/yggdrasil:runner-$img" "$target"; then
                echo "  updated $target"
              else
                echo "  WARN: tag failed $target，检查远端已有 tag"
              fi
            else
              echo "  WARN: pull failed yggdrasil:runner-$img，检查远端已有 tag"
            fi

            if ! docker image inspect "$target" >/dev/null 2>&1; then
              missing+=("$target")
              echo "  ERROR: runner image unavailable: $target"
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::runner 镜像不可用：${missing[*]}；已阻止 app 重启"
            exit 1
          fi

          if [[ "$ROLE" != primary ]]; then
            echo "==> standby：镜像已预拉，不启动 app"
            exit 0
          fi

          echo "==> [3/3] force recreate app (postgres 与数据卷不动)"
          docker compose --env-file .env up -d --no-deps --force-recreate app
          expected_id="$(docker image inspect "$REG/yggdrasil:$APP_TAG" --format '{{.Id}}')"
          running_id="$(docker inspect yggdrasil-app --format '{{.Image}}')"
          if [[ "${expected_id#sha256:}" != "${running_id#sha256:}" ]]; then
            echo "::error::app container image mismatch: expected ${expected_id}, running ${running_id}"
            exit 1
          fi
          echo "  running app image: ${running_id}"

          echo "==> pull-based xun deploy script done"
          REMOTE

      # 轮询内部健康端点（经 nginx-proxy 容器访问 app:3000），最多等约 60s。
      - name: Health check
        id: health
        if: steps.role.outputs.role == 'primary'
        env:
          XUN_USER: ${{ secrets.XUN_USER }}
          XUN_HOST: ${{ secrets.XUN_HOST }}
          XUN_PORT: ${{ secrets.XUN_PORT }}
          EXPECTED_HASH: ${{ github.sha }}
        run: |
          : "${XUN_USER:?secret XUN_USER 未设置}"
          port="${XUN_PORT:-29888}"
          expected_hash="$EXPECTED_HASH"
          ok=0
          for i in $(seq 1 12); do
            echo "health probe #$i ..."
            if headers="$(ssh -p "$port" -o BatchMode=yes "${XUN_USER}@${XUN_HOST}" \
                 'docker exec nginx-proxy curl -fsS -D - -o /dev/null http://yggdrasil-app:3000/readyz' 2>/dev/null)" \
              && printf '%s\n' "$headers" | tr -d '\r' \
                | grep -Fqi "x-yggdrasil-hash: $expected_hash"; then
              ok=1
              echo "readyz + version OK"
              break
            fi
            sleep 5
          done
          [ "$ok" = "1" ] || { echo "::error::app /readyz 未就绪或运行版本不是 $expected_hash"; exit 1; }
          ssh -p "$port" -o BatchMode=yes "${XUN_USER}@${XUN_HOST}" \
            'docker ps --filter name=yggdrasil --format "{{.Names}}\t{{.Status}}"'

      # 部署或健康检查失败时切回部署前记录的镜像。回滚成功后 job 仍为失败，部署失败保持可见。
      # 回滚只切换镜像，不会回退已经应用的数据库迁移：旧二进制会跳过库里已存在的新版本，
      # 能在新 schema 上启动，但业务兼容性是尽力而为；迁移与旧代码不兼容时只能人工处理。
      - name: Roll back on failure
        if: failure() && steps.deploy.outcome != 'skipped' && steps.role.outputs.role == 'primary'
        env:
          XUN_USER: ${{ secrets.XUN_USER }}
          XUN_HOST: ${{ secrets.XUN_HOST }}
          XUN_PORT: ${{ secrets.XUN_PORT }}
          XUN_DEPLOY_DIR: ${{ secrets.XUN_DEPLOY_DIR }}
        run: |
          port="${XUN_PORT:-29888}"
          dir="${XUN_DEPLOY_DIR:-/root/docker/yggdrasil}"
          ssh -p "$port" -o BatchMode=yes "${XUN_USER}@${XUN_HOST}" 'bash -s' "$dir" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          prev="$(cat .previous-app-image 2>/dev/null || true)"
          running="$(docker inspect yggdrasil-app --format '{{.Image}}' 2>/dev/null || true)"
          [[ -n "$prev" ]] || { echo "::error::无上一版本镜像记录，无法回滚"; exit 1; }
          if [[ "${prev#sha256:}" == "${running#sha256:}" ]]; then
            echo "运行中即为上一版本镜像，无需回滚"; exit 0
          fi
          docker image inspect "$prev" >/dev/null 2>&1 || { echo "::error::上一版本镜像 $prev 已不存在"; exit 1; }
          docker tag "$prev" localhost/yggdrasil:latest
          docker compose --env-file .env up -d --no-deps --force-recreate app
          for i in $(seq 1 12); do
            if docker exec nginx-proxy curl -fsS -o /dev/null http://yggdrasil-app:3000/readyz; then
              echo "::warning::已回滚到 $prev"; exit 0
            fi
            sleep 5
          done
          echo "::error::回滚到 $prev 后 /readyz 仍未就绪"; exit 1
          REMOTE

  # ── deploy-rua：deploy-xun 结束后按 ROLE 部署 rua ──
  # 平时 rua 是 standby：只在 deploy-xun 成功后预拉 app 与 runner 镜像，使故障切换时启动的
  # 版本与 xun 运行中的一致；xun 失败回滚时保留旧镜像。rua 为 primary（已故障切换）时不看
  # deploy-xun 结果，照常重建 app 并做健康检查。
  # 受 repo 变量 RUA_DEPLOY_ENABLED=true 门控；未设则跳过。rua 失败 best-effort，
  # 不阻断发版作业。主应用使用 publish-amd64-ghcr 发布的 commit tag。
  # 所需 secrets：RUA_SSH_KEY / RUA_HOST / RUA_USER（启用后）、RUA_PORT（默认 29888）、
  # RUA_DEPLOY_DIR（默认 /root/docker/yggdrasil）、RUA_KNOWN_HOSTS（必填，拒绝 TOFU）。
  deploy-rua:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-gate, publish-amd64-ghcr, publish-runners, deploy-xun]
    if: >-
      !cancelled()
      && vars.RUA_DEPLOY_ENABLED == 'true'
      && needs.deploy-gate.outputs.deploy == 'true'
      && needs.publish-amd64-ghcr.result == 'success'
      && needs.publish-runners.result == 'success'
    environment:
      name: production
    concurrency:
      group: deploy-rua
      cancel-in-progress: false
    steps:
      - name: Configure SSH (rua replica)
        env:
          RUA_SSH_KEY: ${{ secrets.RUA_SSH_KEY }}
          RUA_HOST: ${{ secrets.RUA_HOST }}
          RUA_KNOWN_HOSTS: ${{ secrets.RUA_KNOWN_HOSTS }}
        run: |
          : "${RUA_SSH_KEY:?secret RUA_SSH_KEY 未设置（已启用 RUA_DEPLOY_ENABLED）}"
          : "${RUA_HOST:?secret RUA_HOST 未设置}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$RUA_SSH_KEY" > ~/.ssh/id_ed25519_rua
          chmod 600 ~/.ssh/id_ed25519_rua
          : "${RUA_KNOWN_HOSTS:?secret RUA_KNOWN_HOSTS 未设置（拒绝 TOFU）}"
          printf '%s\n' "$RUA_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Detect node role (rua)
        id: role
        env:
          RUA_USER: ${{ secrets.RUA_USER }}
          RUA_HOST: ${{ secrets.RUA_HOST }}
          RUA_PORT: ${{ secrets.RUA_PORT }}
          RUA_DEPLOY_DIR: ${{ secrets.RUA_DEPLOY_DIR }}
        run: |
          : "${RUA_USER:?secret RUA_USER 未设置}"
          port="${RUA_PORT:-29888}"
          dir="${RUA_DEPLOY_DIR:-/root/docker/yggdrasil}"
          role="$(ssh -p "$port" -i ~/.ssh/id_ed25519_rua -o BatchMode=yes "${RUA_USER}@${RUA_HOST}" \
            'bash -s' "$dir" <<<'cat "$1/ROLE" 2>/dev/null || echo primary' | tr -d '[:space:]')"
          case "$role" in
            primary|standby) echo "rua role: $role" ;;
            *) echo "::error::rua ROLE 无效：${role:-<空>}"; exit 1 ;;
          esac
          echo "role=$role" >> "$GITHUB_OUTPUT"

      # 远端用 podman（rua 是 rootful Podman，非 Docker daemon）。standby 只在 xun 部署成功后预拉镜像。
      - name: Pull app and runner images to rua and restart if primary
        id: deploy
        if: steps.role.outputs.role == 'primary' || needs.deploy-xun.result == 'success'
        continue-on-error: true
        env:
          RUA_USER: ${{ secrets.RUA_USER }}
          RUA_HOST: ${{ secrets.RUA_HOST }}
          RUA_PORT: ${{ secrets.RUA_PORT }}
          RUA_DEPLOY_DIR: ${{ secrets.RUA_DEPLOY_DIR }}
          OWNER: ${{ github.repository_owner }}
          ROLE: ${{ steps.role.outputs.role }}
        run: |
          : "${RUA_USER:?secret RUA_USER 未设置}"
          port="${RUA_PORT:-29888}"
          dir="${RUA_DEPLOY_DIR:-/root/docker/yggdrasil}"
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          app_tag="sha-${GITHUB_SHA::7}-amd64"
          ssh -p "$port" -i ~/.ssh/id_ed25519_rua -o BatchMode=yes \
            "${RUA_USER}@${RUA_HOST}" 'bash -s' "ghcr.io/${owner}" "${dir}" "${app_tag}" "${ROLE}" <<'REMOTE'
          set -euo pipefail
          REG="$1"
          DIR="$2"
          APP_TAG="$3"
          ROLE="$4"

          # 拉取之前记录当前运行镜像，任何失败点都能据此回滚到本次部署前的版本。
          # standby 没有运行中的 app，保留原记录。
          cd "$DIR"
          if [[ "$ROLE" == primary ]]; then
            prev_id="$(podman inspect yggdrasil-app --format '{{.Image}}' 2>/dev/null || true)"
            printf '%s\n' "$prev_id" > .previous-app-image
            echo "==> previous app image: ${prev_id:-<none>}"
          fi

          pull_retry() {
            local img="$1" i
            for i in 1 2 3; do
              podman pull "$img" && return 0
              echo "  pull retry $i/3: $img"
              sleep 5
            done
            return 1
          }

          echo "==> [rua] pull + tag amd64 app image ($APP_TAG)"
          pull_retry "$REG/yggdrasil:$APP_TAG" \
            || { echo "::error::rua app image pull failed: $REG/yggdrasil:$APP_TAG"; exit 1; }
          podman tag "$REG/yggdrasil:$APP_TAG" localhost/yggdrasil:latest

          echo "==> [rua] pull + tag runner images (required; missing images block deploy)"
          missing=()
          for img in base python node go rust bun; do
            target="localhost/yggdrasil-runner-$img:latest"
            if pull_retry "$REG/yggdrasil:runner-$img"; then
              if podman tag "$REG/yggdrasil:runner-$img" "$target"; then
                echo "  updated $target"
              else
                echo "  WARN: tag failed $target，检查远端已有 tag"
              fi
            else
              echo "  WARN: pull failed yggdrasil:runner-$img，检查远端已有 tag"
            fi

            if ! podman image inspect "$target" >/dev/null 2>&1; then
              missing+=("$target")
              echo "  ERROR: runner image unavailable: $target"
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::runner 镜像不可用：${missing[*]}；已阻止 app 重启"
            exit 1
          fi

          if [[ "$ROLE" != primary ]]; then
            echo "==> [rua] standby：镜像已预拉，不启动 app"
            exit 0
          fi

          echo "==> [rua] force recreate app"
          podman compose --env-file .env up -d --no-deps --force-recreate app
          expected_id="$(podman image inspect "$REG/yggdrasil:$APP_TAG" --format '{{.Id}}')"
          running_id="$(podman inspect yggdrasil-app --format '{{.Image}}')"
          if [[ "${expected_id#sha256:}" != "${running_id#sha256:}" ]]; then
            echo "::error::rua app container image mismatch: expected ${expected_id}, running ${running_id}"
            exit 1
          fi
          echo "  rua running app image: ${running_id}"
          echo "==> pull-based rua deploy script done"
          REMOTE

      # rua 健康检查（经 nginx-proxy 容器访问 app:3000），最多等约 60s；best-effort。
      - name: Health check (rua)
        id: health
        if: steps.role.outputs.role == 'primary'
        continue-on-error: true
        env:
          RUA_USER: ${{ secrets.RUA_USER }}
          RUA_HOST: ${{ secrets.RUA_HOST }}
          RUA_PORT: ${{ secrets.RUA_PORT }}
          EXPECTED_HASH: ${{ github.sha }}
        run: |
          : "${RUA_USER:?secret RUA_USER 未设置}"
          port="${RUA_PORT:-29888}"
          expected_hash="$EXPECTED_HASH"
          ok=0
          for i in $(seq 1 12); do
            echo "rua health probe #$i ..."
            if headers="$(ssh -p "$port" -i ~/.ssh/id_ed25519_rua -o BatchMode=yes "${RUA_USER}@${RUA_HOST}" \
                 'podman exec nginx-proxy curl -fsS -D - -o /dev/null http://yggdrasil-app:3000/readyz' 2>/dev/null)" \
              && printf '%s\n' "$headers" | tr -d '\r' \
                | grep -Fqi "x-yggdrasil-hash: $expected_hash"; then
              ok=1
              echo "rua readyz + version OK"
              break
            fi
            sleep 5
          done
          [ "$ok" = "1" ] || { echo "::warning::rua /readyz 未就绪或运行版本不是 $expected_hash（不阻断作业）"; exit 1; }
          ssh -p "$port" -i ~/.ssh/id_ed25519_rua -o BatchMode=yes "${RUA_USER}@${RUA_HOST}" \
            'podman ps --filter name=yggdrasil --format "{{.Names}}\t{{.Status}}"'

      # 与 deploy-xun 同样回滚到部署前镜像（回滚不回退数据库迁移）。deploy/health 两步带
      # continue-on-error，failure() 不会为真，因此改用 outcome 判断；本步骤同样 best-effort。
      - name: Roll back on failure (rua)
        if: steps.role.outputs.role == 'primary' && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        continue-on-error: true
        env:
          RUA_USER: ${{ secrets.RUA_USER }}
          RUA_HOST: ${{ secrets.RUA_HOST }}
          RUA_PORT: ${{ secrets.RUA_PORT }}
          RUA_DEPLOY_DIR: ${{ secrets.RUA_DEPLOY_DIR }}
        run: |
          port="${RUA_PORT:-29888}"
          dir="${RUA_DEPLOY_DIR:-/root/docker/yggdrasil}"
          ssh -p "$port" -i ~/.ssh/id_ed25519_rua -o BatchMode=yes "${RUA_USER}@${RUA_HOST}" 'bash -s' "$dir" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          prev="$(cat .previous-app-image 2>/dev/null || true)"
          running="$(podman inspect yggdrasil-app --format '{{.Image}}' 2>/dev/null || true)"
          [[ -n "$prev" ]] || { echo "::error::无上一版本镜像记录，无法回滚"; exit 1; }
          if [[ "${prev#sha256:}" == "${running#sha256:}" ]]; then
            echo "运行中即为上一版本镜像，无需回滚"; exit 0
          fi
          podman image inspect "$prev" >/dev/null 2>&1 || { echo "::error::上一版本镜像 $prev 已不存在"; exit 1; }
          podman tag "$prev" localhost/yggdrasil:latest
          podman compose --env-file .env up -d --no-deps --force-recreate app
          for i in $(seq 1 12); do
            if podman exec nginx-proxy curl -fsS -o /dev/null http://yggdrasil-app:3000/readyz; then
              echo "::warning::已回滚到 $prev"; exit 0
            fi
            sleep 5
          done
          echo "::error::回滚到 $prev 后 /readyz 仍未就绪"; exit 1
          REMOTE
